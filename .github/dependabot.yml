# Keeps dependencies up to date.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Two things here are deliberate rather than cosmetic:
#
# `commit-message.prefix` decides whether a bump reaches the changelog and cuts
# a release. The rule is "does this change what users install?" —
#   yes -> `fix`, so release-please opens a release PR with a visible entry
#   no  -> `chore`, hidden from the changelog and never a release on its own
# The image is consumed as `:latest` by docker-compose.yaml, so a base image
# or dependency bump is exactly the kind of thing that should get a version.
# Stated explicitly rather than left to Dependabot's inference from commit
# history, which now contains `fix(deps)` commits too.
#
# `groups:` — without it Dependabot opens one PR per dependency, which is a
# Monday review queue of a dozen near-identical PRs. Grouped, each ecosystem
# gives one PR that either goes green or does not.
#
# There is a single release component (the one image), so every `fix` bump
# below ends up in the same release PR. vendor/ has no entry here on purpose:
# it is a verbatim copy of upstream, refreshed only by vendor/update.sh.
version: 2
updates:
  # Workflow actions are pinned to floating major tags, so without this they
  # drift silently and never surface a PR.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    # CI-only: never a release on its own.
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      actions:
        patterns: ["*"]

  # FastAPI and friends in pyproject.toml / uv.lock, installed into the image.
  - package-ecosystem: "uv"
    directory: "/webui/backend"
    schedule:
      interval: weekly
    commit-message:
      prefix: "fix"
      include: "scope"
    groups:
      python:
        patterns: ["*"]

  # The `python` runtime image and the `oven/bun` build stage in webui/Dockerfile —
  # the OS and interpreter users actually run.
  - package-ecosystem: "docker"
    directory: "/webui"
    schedule:
      interval: weekly
    commit-message:
      prefix: "fix"
      include: "scope"

  # React, Vite and the build toolchain. Everything in this manifest —
  # devDependencies included — is part of the build that produces the published
  # image, so `fix` across the board rather than splitting by dependency-type:
  # bumping vite or typescript changes the bundle users get just as much as
  # bumping react does.
  - package-ecosystem: "bun"
    directory: "/webui/frontend"
    schedule:
      interval: weekly
    commit-message:
      prefix: "fix"
      include: "scope"
    groups:
      bun:
        patterns: ["*"]
    # TypeScript 7 is held back by the linter rather than by our code:
    # typescript-eslint declares `typescript: ">=4.8.4 <6.1.0"` and refuses to
    # load against 7, so `bun run lint` exits before reading a file and the whole
    # grouped PR goes red. Grouping makes that one incompatibility block the
    # other twenty-odd bumps, which is what happened to #10. Drop this entry
    # once typescript-eslint ships TS 7 support:
    # https://github.com/typescript-eslint/typescript-eslint/issues/10940
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
