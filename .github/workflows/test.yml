name: Test

on:
  # The pull request is the gate: every change reaches main through one, so
  # testing pull requests tests everything that can land. A bare `push:` would
  # just run the same job a second time before the PR is even open.
  pull_request:
  # For re-running against a branch without pushing an empty commit.
  workflow_dispatch:

# A newer push to the same PR makes an in-flight run obsolete — drop it rather
# than pay for a result nobody will read.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

# Read-only: this workflow never publishes anything. docker-publish.yml is the
# only place that needs registry write access.
permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: "webui/backend/uv.lock"

      - name: Install Python dependencies
        working-directory: webui/backend
        run: uv sync --frozen

      - name: Byte-compile
        working-directory: webui/backend
        run: uv run python -m compileall -q .

      - name: Unit tests
        working-directory: webui/backend
        run: uv run pytest tests -q

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JS dependencies
        working-directory: webui/frontend
        run: bun install --frozen-lockfile

      - name: Lint
        working-directory: webui/frontend
        run: bun run lint

      - name: Build
        working-directory: webui/frontend
        run: bun run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Build the single image that ships, without pushing it: this catches a
      # bad uv.lock/package bump, a broken apt package or a build failure
      # inside the image. Same cache scope as docker-publish.yml.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: webui/Dockerfile
          push: false
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
