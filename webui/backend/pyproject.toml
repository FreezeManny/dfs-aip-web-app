[project]
name = "dfs-aip-backend"
version = "1.1.2"
description = "DFS AIP Updater FastAPI backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.11.3",
    "beautifulsoup4>=4.12.0",
    "fastapi>=0.162.0",
    "pikepdf>=9.0.0",
    "pillow>=10.0.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pyxdg>=0.28",
    "requests>=2.31.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=0.1.0",
    "pytest>=8.0.0",
]
